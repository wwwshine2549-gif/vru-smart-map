<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VRU Smart Map — หุ่นจำลองดิจิทัล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16191d; --ink2:#555b63; --ink3:#8a9097;
  --paper:#f5f2eb; --card:#fffdf8; --line:#d9d3c6; --line2:#ebe6db;
  --accent:#ff5a1f;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans Thai',system-ui,sans-serif;
  --glass:rgba(255,253,248,.86);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--sans);color:var(--ink);
  background:linear-gradient(180deg,#8fb8d6 0%,#b9d2e2 30%,#dbe5e6 52%,#e3e7e1 100%)}
#scene{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:none;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;
  font:600 10.5px/1 var(--mono);color:var(--ink);background:var(--card);border:1px solid rgba(0,0,0,.12);
  padding:4px 7px 4px 5px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:opacity .3s,background .15s;will-change:transform}
.tag::after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:7px;background:rgba(22,25,29,.45)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c,#999);flex:none}
.tag span{font:500 12px var(--sans);max-width:0;overflow:hidden;opacity:0;transition:max-width .35s,opacity .25s}
.tag.near span{max-width:240px;opacity:1}
.tag:hover,.tag.hot{background:var(--ink);color:#fff}
.tag.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag.sel i,.tag.hot i,.tag:hover i{background:#fff}
.tag.far{opacity:.55}
.tag.hide{display:none}
.slabel{position:absolute;transform:translate(-50%,-50%);font:600 10px/1 var(--mono);letter-spacing:.16em;color:rgba(255,255,255,.92);
  text-shadow:0 1px 3px rgba(0,0,0,.45);white-space:nowrap;pointer-events:none}

#top{position:fixed;left:16px;top:16px;right:16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;pointer-events:none;z-index:5}
.left{display:flex;gap:10px;align-items:flex-start}
.brand{pointer-events:auto;background:var(--ink);color:#fff;border-radius:7px;padding:9px 13px 9px 10px;display:flex;gap:10px;align-items:center;height:48px}
.brand .mark{width:28px;height:28px;border:1.5px solid #fff;border-radius:4px;display:grid;place-items:center;font:600 10.5px var(--mono)}
.brand b{font:600 13px/1.1 var(--mono);letter-spacing:.08em;display:block}
.brand small{font-size:10.5px;opacity:.65;display:block;margin-top:3px}
.search{pointer-events:auto;position:relative;width:300px}
.search input{width:100%;height:48px;border:1px solid rgba(0,0,0,.1);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:7px;padding:0 14px 0 40px;
  font:500 14px var(--sans);color:var(--ink);outline:none}
.search input:focus{border-color:var(--ink);background:var(--card)}
.search>svg{z-index:1;position:absolute;left:13px;top:15px;width:18px;height:18px;stroke:var(--ink2)}
.results{position:absolute;top:54px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:7px;box-shadow:0 10px 30px rgba(0,0,0,.14);display:none;max-height:340px;overflow-y:auto}
.results.on{display:block}
.res{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line2);font-size:13px}
.res:last-child{border-bottom:0}
.res:hover,.res.act{background:var(--paper)}
.res .n{font:600 11px var(--mono);min-width:28px;color:var(--ink2)}
.res .z{margin-left:auto;font:500 10px var(--mono);color:var(--ink3);white-space:nowrap}
.res.empty{color:var(--ink3);cursor:default}

/* zone bar */
.zonebar{pointer-events:auto;justify-self:center;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.1);border-radius:9px;padding:4px;position:relative;display:flex;gap:2px}
.zbtn{border:0;background:transparent;font:600 13px var(--sans);color:var(--ink2);padding:9px 18px 12px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:104px}
.zbtn small{font:500 9.5px var(--mono);letter-spacing:.12em;opacity:.7}
.zbtn:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.zbtn.on{background:var(--ink);color:#fff}
.zprog{position:absolute;left:8px;right:8px;bottom:4px;height:2px;background:rgba(0,0,0,.08);border-radius:2px;overflow:hidden;pointer-events:none}
.zprog div{height:100%;width:0;background:var(--accent)}
.right{display:flex;gap:8px}
.ibtn{pointer-events:auto;width:48px;height:48px;border-radius:7px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.1);display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:var(--card);border-color:var(--ink)}
.ibtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* zone title */
#zt{position:fixed;left:24px;bottom:26px;z-index:3;pointer-events:none;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.35);transition:opacity .4s}
#zt small{font:600 11px var(--mono);letter-spacing:.2em;opacity:.9}
#zt h2{font-size:44px;line-height:1.05;font-weight:700;letter-spacing:-.01em;margin-top:6px}
#zt p{font-size:13.5px;margin-top:6px;opacity:.95}
#zt.swap{animation:zin .7s cubic-bezier(.2,.8,.2,1)}
@keyframes zin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

#hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:3;pointer-events:none;color:#fff;font:500 12.5px var(--sans);text-shadow:0 1px 8px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .6s}
#hint svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
#hint.off{opacity:0}

/* minimap */
#mini{position:fixed;right:16px;bottom:16px;z-index:4;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:8px;cursor:pointer}
#mini canvas{display:block;width:78px;height:270px}
#mini b{display:block;font:600 9px var(--mono);letter-spacing:.14em;color:var(--ink2);text-align:center;margin-bottom:6px}

/* panel */
#panel{position:fixed;top:80px;right:16px;bottom:16px;width:380px;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:6;
  box-shadow:0 24px 60px rgba(0,0,0,.2);display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .5s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#panel.open{transform:none}
.p-head{padding:18px 18px 14px;border-bottom:1px solid var(--line2);position:relative}
.p-id{font:600 11px var(--mono);letter-spacing:.1em;color:var(--ink2);display:flex;gap:8px;align-items:center}
.p-id .code{background:var(--ink);color:#fff;padding:3px 6px;border-radius:3px}
.p-name{font-size:20px;font-weight:600;line-height:1.3;margin-top:10px;padding-right:36px}
.p-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pc{font:500 11px var(--sans);border-radius:3px;padding:3px 7px;background:var(--paper);border:1px solid var(--line2);display:flex;gap:5px;align-items:center}
.pc i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.pc.warn{background:#fff4e5;border-color:#f3d7a8;color:#8a5a00}
.close{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:6px;border:1px solid var(--line2);background:var(--card);cursor:pointer;display:grid;place-items:center}
.close:hover{border-color:var(--ink)}
.close svg{width:14px;height:14px;stroke:var(--ink);stroke-width:2}
.p-body{overflow-y:auto;padding:16px 18px 18px;flex:1}
.photo{aspect-ratio:16/9;border-radius:6px;border:1px dashed #c9c1ad;display:grid;place-items:center;text-align:center;padding:14px;color:var(--ink2);font-size:12px;line-height:1.5;
  background:repeating-linear-gradient(-45deg,#f7f3ea 0 8px,#f1ece0 8px 16px)}
.photo code{font:500 10.5px var(--mono);background:#fff;border:1px solid var(--line);padding:2px 6px;border-radius:3px;display:inline-block;margin-top:6px;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:6px;margin-top:14px;overflow:hidden}
.cell{padding:10px 12px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.cell:nth-child(2n){border-right:0}
.cell:nth-last-child(-n+2){border-bottom:0}
.cell small{display:block;font:500 10px var(--mono);letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
.cell b{display:block;font-size:14px;font-weight:600;margin-top:3px}
.cell b em{font-style:normal;font-weight:400;font-size:11px;color:var(--ink3)}
.sec{margin-top:16px}
.sec h4{font:600 10.5px var(--mono);letter-spacing:.12em;color:var(--ink2);text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between}
.todo{font-size:12.5px;color:var(--ink2);background:var(--paper);border-radius:6px;padding:10px 12px;line-height:1.55}
.nav{display:flex;gap:6px;margin-top:16px}
.nav button{flex:1;height:34px;border:1px solid var(--line);background:var(--card);border-radius:5px;font:500 12px var(--sans);cursor:pointer;color:var(--ink2)}
.nav button:hover{border-color:var(--ink);color:var(--ink)}
.p-foot{padding:12px 18px 16px;border-top:1px solid var(--line2);display:grid;grid-template-columns:1fr auto auto;gap:8px}
.btn{height:42px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:600 13px var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn[disabled]{background:#e9e5dc;border-color:#e9e5dc;color:#9a958a;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.hint2{grid-column:1/-1;font-size:11px;color:var(--ink3)}

.roomcard{background:var(--ink);color:#fff;border-radius:8px;padding:14px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.roomcard small{font:600 10px var(--mono);letter-spacing:.14em;opacity:.65}
.roomcard b{display:block;font:600 30px/1.1 var(--mono);margin-top:4px}
.roomcard p{font-size:12.5px;opacity:.85;margin-top:6px;line-height:1.5}
.roomcard .fl{position:absolute;right:14px;top:14px;background:var(--accent);font:600 12px var(--mono);padding:5px 9px;border-radius:4px}
.roomcard .sample{display:inline-block;margin-top:8px;font:500 10.5px var(--sans);background:rgba(255,255,255,.12);padding:3px 7px;border-radius:3px}
.floors{border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.frow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:12.5px;cursor:pointer}
.frow:last-child{border-bottom:0}
.frow:hover{background:var(--paper)}
.frow.on{background:#fff1ea}
.frow .f{font:600 11px var(--mono);color:var(--ink2)}
.frow.on .f{color:var(--accent)}
.frow .r{font:500 12px var(--mono)}
.frow .nm{font-size:11px;color:var(--ink3)}
.res .ico{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;background:var(--paper);flex:none}
.res .ico svg{width:13px;height:13px;stroke:var(--ink2);fill:none;stroke-width:2}
.res.room .ico{background:#fff1ea}.res.room .ico svg{stroke:var(--accent)}
.res .sub{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.rh{font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--ink3);padding:8px 12px 4px;background:var(--paper)}
#list{position:fixed;inset:0;background:rgba(22,25,29,.4);z-index:8;display:none;align-items:flex-start;justify-content:center;padding:70px 16px 16px}
#list.on{display:flex}
.list-box{background:var(--card);border-radius:10px;width:min(560px,100%);max-height:100%;overflow:auto;border:1px solid var(--line)}
.list-box h3{position:sticky;top:0;background:var(--card);padding:16px 18px;border-bottom:1px solid var(--line2);font-size:15px;display:flex;justify-content:space-between;align-items:center;z-index:1}
.zone-h{font:600 10.5px var(--mono);letter-spacing:.12em;color:var(--ink3);padding:14px 18px 6px}
.li{display:flex;gap:10px;align-items:center;padding:9px 18px;cursor:pointer;font-size:13.5px}
.li:hover{background:var(--paper)}
.li .n{font:600 11px var(--mono);min-width:28px;color:var(--ink2)}
.li .d{width:7px;height:7px;border-radius:50%}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-10px);background:var(--ink);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:5px;opacity:0;transition:all .25s;z-index:9;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:5px 9px;border-radius:4px;z-index:7;opacity:0;transition:opacity .12s;white-space:nowrap}
#tip b{font:600 10.5px var(--mono);margin-right:6px;opacity:.7}
#loader{position:fixed;inset:0;background:#dfe6e8;display:grid;place-items:center;z-index:20;transition:opacity .7s}
#loader.done{opacity:0;pointer-events:none}
#loader div{font:500 12px var(--mono);letter-spacing:.14em;color:var(--ink2);text-align:center}
#loader div::after{content:"";display:block;width:140px;height:2px;margin:12px auto 0;background:linear-gradient(90deg,var(--ink) 0 40%,transparent 40%);background-size:200% 100%;animation:ld 1s linear infinite}
@keyframes ld{to{background-position:-200% 0}}
body.focus #zt,body.focus #hint{opacity:0}

@media (max-width:760px){
  #top{left:10px;right:10px;top:10px;grid-template-columns:1fr auto;gap:8px}
  .brand{height:44px}
  .brand small{display:none}
  .left{flex-wrap:wrap}
  .search{flex:1 1 100%;width:auto}
  .zonebar{grid-column:1/-1;order:4;justify-self:stretch}
  .zbtn{flex:1;min-width:0;padding:8px 6px 11px}
  .ibtn{width:44px;height:44px}
  #mini{display:none}
  #zt{left:16px;bottom:20px}
  #zt h2{font-size:32px}
  #hint{bottom:110px}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:62vh;border-radius:16px 16px 0 0;transform:translateY(105%)}
  #panel.open{transform:none}
  #panel::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line);position:absolute;left:50%;top:7px;transform:translateX(-50%)}
  .p-name{font-size:17px}
  .photo{aspect-ratio:21/9}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="tags"></div>

<div id="top">
  <div class="left">
    <div class="brand"><div class="mark">VRU</div><div><b>SMART MAP</b><small>หุ่นจำลองดิจิทัล · v0.2</small></div></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="ค้นหาตึก หรือเลขห้อง เช่น 5301" autocomplete="off">
      <div class="results" id="results"></div>
    </div>
  </div>
  <div class="zonebar" id="zonebar">
    <button class="zbtn on" data-z="1"><small>ZONE 01</small>หน้ามอ</button>
    <button class="zbtn" data-z="2"><small>ZONE 02</small>กลางมอ</button>
    <button class="zbtn" data-z="3"><small>ZONE 03</small>หลังมอ</button>
    <div class="zprog"><div id="zprog"></div></div>
  </div>
  <div class="right">
    <div class="ibtn" id="tList" title="รายการอาคาร"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></div>
  </div>
</div>

<div id="zt"><small id="ztS">ZONE 01 / 03</small><h2 id="ztH">หน้ามหาวิทยาลัย</h2><p id="ztP"></p></div>
<div id="hint"><span>เลื่อนเมาส์ / ปัดขึ้น เพื่อบินไปข้างหน้า · ลากเพื่อมองรอบ</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div>
<div id="mini"><b>แผนผัง</b><canvas id="mcv" width="156" height="540"></canvas></div>

<aside id="panel" aria-live="polite">
  <div class="p-head">
    <div class="p-id"><span class="code" id="pCode">B00</span><span id="pZone"></span></div>
    <div class="p-name" id="pName">—</div>
    <div class="p-chips" id="pChips"></div>
    <button class="close" id="pClose" aria-label="ปิด"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="p-body">
    <div id="pRoom"></div>
    <div class="photo" id="pPhoto"></div>
    <div class="grid" id="pGrid"></div>
    <div class="sec"><h4><span>ชั้น · ห้อง</span><span>ROOMS</span></h4><div id="pRooms"></div></div>
    <div class="sec"><h4><span>ลิงก์ตรง (สำหรับ QR)</span><span>DEEP LINK</span></h4><div class="todo" id="pLink"></div></div>
    <div class="nav"><button id="pPrev">← อาคารก่อนหน้า</button><button id="pNext">อาคารถัดไป →</button></div>
  </div>
  <div class="p-foot">
    <button class="btn" id="pNav" disabled><svg viewBox="0 0 24 24"><path d="M12 2 4 21l8-4 8 4z"/></svg>นำทางด้วย Google Maps</button>
    <button class="btn ghost" id="pCopy" title="คัดลอกลิงก์"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></button>
    <button class="btn ghost" id="pBack" title="กลับสู่เส้นทางบิน"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <div class="hint2">ปุ่มนำทางจะเปิดใช้เมื่อได้พิกัดจุดอ้างอิง 3 จุด · ลากเพื่อหมุนรอบอาคาร</div>
  </div>
</aside>

<div id="list"><div class="list-box"><h3>อาคารทั้งหมด <button class="close" style="position:static" id="lClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></h3><div id="listBody"></div></div></div>
<div id="toast"></div>
<div id="tip"></div>
<div id="loader"><div>กำลังประกอบหุ่นจำลอง</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CATS = {
  edu:{name:'อาคารเรียน/คณะ',c:'#3b6ef5'}, service:{name:'สำนักงาน/บริการ',c:'#7a5af8'},
  shop:{name:'อาหาร/ร้านค้า',c:'#e8930c'}, sport:{name:'กีฬา',c:'#11a37f'},
  dorm:{name:'หอพัก/ที่พัก',c:'#e0457b'}, landmark:{name:'สัญลักษณ์/วัฒนธรรม',c:'#c0392b'},
  school:{name:'โรงเรียนสาธิต',c:'#0aa2c0'}
};
/*DATA*/

/* 3 zones: front / middle / back */
const zoneOf=id=> (id<=12||(id>=30&&id<=32))?1 : id<=43?2 : 3;
const ZONES={
  1:{name:'หน้ามหาวิทยาลัย',short:'หน้ามอ',s:110,desc:'ถนนพหลโยธิน → อนุสาวรีย์ → อาคาร 100 ปี'},

function findRooms(v){ // v normalized
  const code=v.replace(/^(ห้อง|room|rm)/,'').replace(/[-_.]/g,''); if(!/^[a-z]*\d{2,5}$/.test(code)) return [];
  const out=[];
  for(const b of DATA) for(const r of b.rooms){
    const lo=parseInt(r.from,10), hi=parseInt(r.to,10), c=parseInt(code,10);
    if(code.length===r.from.length&&c>=lo&&c<=hi) out.unshift({type:'room',b,floor:r.floor,room:code,r});
    else if(code.length<r.from.length&&(r.from.startsWith(code)||r.to.startsWith(code)||(String(lo).slice(0,code.length)<=code&&String(hi).slice(0,code.length)>=code)))
      out.push({type:'range',b,floor:r.floor,r});
  }
  return out.slice(0,8);
}

    g.fillStyle='#d8d0bf'; g.fillRect(62,34,4,58); g.fillRect(22,60,84,3);

  } else if(kind==='white'){

  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t;
}
const TEX={cream:facade('cream'),white:facade('white'),house:facade('house')};
function boxUV(g,w,d,fl,bay=1.6){ const uv=g.attributes.uv; const faces=[d,d,0,0,w,w];
  for(let f=0;f<6;f++){ if(!faces[f]) continue; const ru=Math.max(1,Math.round(faces[f]/bay));
    for(let v=0;v<4;v++){const i=f*4+v; uv.setXY(i,uv.getX(i)*ru,uv.getY(i)*fl);} } uv.needsUpdate=true; }
function hipRoof(w,d,h){
  const swap=d>w; if(swap)[w,d]=[d,w]; const a=w/2,b=d/2,r=Math.max(a-b,0);
  const P=(x,y,z)=>swap?[z,y,x]:[x,y,z];
  const c0=P(-a,0,-b),c1=P(a,0,-b),c2=P(a,0,b),c3=P(-a,0,b),t1=P(-r,h,0),t2=P(r,h,0);
  let tris=[[c0,t2,c1],[c0,t1,t2],[c3,c2,t2],[c3,t2,t1],[c1,t2,c2],[c3,t1,c0]];
  if(swap) tris=tris.map(t=>[t[0],t[2],t[1]]);
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(tris.flat(2),3)); g.computeVertexNormals(); return g;
}
function barrel(w,d,h){ const along=w>=d, len=along?w:d, r=(along?d:w)/2;
  const g=new THREE.CylinderGeometry(r,r,len,22,1,false,0,Math.PI); g.rotateZ(Math.PI/2); g.scale(1,h/r,1); if(!along) g.rotateY(Math.PI/2); return g; }

const pickables=[]; const byId=new Map();
function makeBuilding(b){
  const grp=new THREE.Group(); const mats=[];
  const own=m=>{const c=m.clone(); mats.push(c); return c;};
  const add=(mesh,cast=true)=>{mesh.castShadow=cast;mesh.receiveShadow=true;mesh.userData.b=b;grp.add(mesh);pickables.push(mesh);return mesh;};
  const wallTex = b.style==='modern'?TEX.white : b.kind==='houses'?TEX.house : TEX.cream;
  const wall=own(new THREE.MeshStandardMaterial({map:wallTex,roughness:.82}));
  const flat=own(M(0xd6d6d2)); const white=own(mat.white);
  let roofM = b.kind==='hall'?own(mat.teal) : b.kind==='thai'?own(mat.woodDark) : b.kind==='houses'?own(mat.terracotta) : b.style==='arch'?own(M(b.id===4?0x8fc3cf:0x7f878f,{roughness:.6,metalness:.2})) : own(mat.roofDark);
  let maxH=0,minx=1e9,maxx=-1e9,minz=1e9,maxz=-1e9;
  const ext=(cx,cz,hw,hd)=>{minx=Math.min(minx,cx-hw);maxx=Math.max(maxx,cx+hw);minz=Math.min(minz,cz-hd);maxz=Math.max(maxz,cz+hd);};

  if(b.kind==='monument'){
    const [x,y]=b.rects[0]; const cx=X(x+7),cz=Z(y+7);
    add(new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.4,.35,32),white)).position.set(cx,.18,cz);
    add(new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.6,.35,32),white)).position.set(cx,.5,cz);
    add(new THREE.Mesh(new THREE.BoxGeometry(.9,1.4,.9),white)).position.set(cx,1.35,cz);
    const st=add(new THREE.Mesh(new THREE.CapsuleGeometry(.32,.7,6,12),own(mat.gold))); st.position.set(cx,2.6,cz);
    maxH=3.2; ext(cx,cz,2.4,2.4);

    const glass=own(new THREE.MeshStandardMaterial({color:0xdde9ef,transparent:true,opacity:.25,roughness:.1,depthWrite:false}));
    const m=new THREE.Mesh(geo,glass); m.position.set(X(x+w/2),H/2,Z(y+h/2)); m.userData.b=b; grp.add(m); pickables.push(m);
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0x56606a,transparent:true,opacity:.75})); e.position.copy(m.position); grp.add(e);
    for(let i=1;i<b.floors;i++){ const f=new THREE.Mesh(new THREE.BoxGeometry(w*S,.06,h*S),M(0xbfc3c4)); f.position.set(m.position.x,i*FH,m.position.z); grp.add(f); }
    // crane

    const jib=new THREE.Mesh(new THREE.BoxGeometry(9,.25,.25),M(0xe0b43a)); jib.position.set(X(x+20)+3.5,H+3,Z(y+15)); jib.castShadow=true; grp.add(jib);
    maxH=H; ext(X(x+w/2),Z(y+h/2),w*S/2,h*S/2);

    const [x,y,w,h]=b.rects[0]; const cx=X(x+w/2),cz=Z(y+h/2),W=w*S,D=h*S;

      const g=new THREE.BoxGeometry(W,H,D); boxUV(g,W,D,fl, b.kind==='houses'?1.2:1.6);

  else if(e.key==='ArrowUp'){act=Math.max(act-1,0);renderRes();e.preventDefault();}
  else if(e.key==='Enter'&&hits[act]){pickHit(hits[act]);q.blur();} else if(e.key==='Escape'){closeResults();q.blur();} });
addEventListener('keydown',e=>{ if(e.target===q) return;
  if(e.key==='/'){e.preventDefault();q.focus();}
  else if(e.key==='Escape'){ $('list').classList.remove('on'); if(mode!=='tour') backToTour(); }
  else if(['1','2','3'].includes(e.key)) goZone(+e.key);
  else if(mode==='tour'&&(e.key==='ArrowDown'||e.key==='s'||e.key==='PageDown')){ sTarget+=140; hideHint(); }
  else if(mode==='tour'&&(e.key==='ArrowUp'||e.key==='w'||e.key==='PageUp')){ sTarget-=140; }
  else if(selected&&e.key==='ArrowRight') $('pNext').click(); else if(selected&&e.key==='ArrowLeft') $('pPrev').click(); });
$('tList').onclick=()=>$('list').classList.add('on'); $('lClose').onclick=()=>$('list').classList.remove('on');
$('list').addEventListener('click',e=>{if(e.target.id==='list')$('list').classList.remove('on');});
$('listBody').innerHTML=[1,2,3].map(z=>`<div class="zone-h">ZONE 0${z} · ${ZONES[z].name.toUpperCase()}</div>`+DATA.filter(b=>b.zone===z).map(b=>`<div class="li" data-id="${b.id}"><span class="n">B${String(b.id).padStart(2,'0')}</span><span class="d" style="background:${CATS[b.cat].c}"></span>${b.name}</div>`).join('')).join('');
$('listBody').querySelectorAll('.li').forEach(el=>el.onclick=()=>select(+el.dataset.id));

/* ============ minimap ============ */
const mcv=$('mcv'), mctx=mcv.getContext('2d'), MK=156/(655-10), MY=118;
const mx=px=>(px-10)*MK, my=py=>(py-MY)*MK;
const mBase=document.createElement('canvas'); mBase.width=156; mBase.height=540;
{ const g=mBase.getContext('2d'); g.fillStyle='#e7e3d8'; g.fillRect(0,0,156,540); g.fillStyle='#4a4e53'; g.fillRect(0,my(130),156,90*MK);
  g.fillStyle='#8fbad0'; [[250,290,293,200],[198,1160,240,86],[345,1032,50,106],[240,1740,62,175],[495,1680,50,150],[280,2105,300,135]].forEach(([x,y,w,h])=>g.fillRect(mx(x),my(y),w*MK,h*MK));
  g.strokeStyle='#8fbad0'; g.lineWidth=24*MK; g.beginPath(); [[655,1245],[420,1440],[210,1630],[120,1900],[50,2330],[40,2410]].forEach(([x,y],i)=>i?g.lineTo(mx(x),my(y)):g.moveTo(mx(x),my(y))); g.stroke();
  g.fillStyle='#c46f50'; g.beginPath(); g.ellipse(mx(410),my(2015),135*MK,62*MK,0,0,7); g.fill();
  g.fillStyle='#8c8f93'; DATA.forEach(b=>b.rects.forEach(([x,y,w,h])=>g.fillRect(mx(x),my(y),Math.max(w*MK,1.5),Math.max(h*MK,1.5))));
  g.setLineDash([4,3]); g.strokeStyle='rgba(22,25,29,.5)'; g.lineWidth=1; [760,1640].forEach(y=>{g.beginPath();g.moveTo(0,my(y));g.lineTo(156,my(y));g.stroke();});
  g.setLineDash([]); g.font='600 13px IBM Plex Mono, monospace'; g.fillStyle='rgba(22,25,29,.55)'; [['01',440],['02',1200],['03',2200]].forEach(([t,y])=>g.fillText(t,4,my(y))); }
const _d=new THREE.Vector3();
function drawMini(){ mctx.drawImage(mBase,0,0); const px=camera.position.x/S+CX, py=camera.position.z/S+CY; camera.getWorldDirection(_d);
  const a=Math.atan2(_d.z,_d.x), cx=mx(px), cy=my(py);
  mctx.fillStyle='rgba(255,90,31,.28)'; mctx.beginPath(); mctx.moveTo(cx,cy); mctx.arc(cx,cy,60,a-.45,a+.45); mctx.closePath(); mctx.fill();
  mctx.fillStyle='#ff5a1f'; mctx.strokeStyle='#fff'; mctx.lineWidth=2; mctx.beginPath(); mctx.arc(cx,cy,6,0,7); mctx.fill(); mctx.stroke(); }
$('mini').addEventListener('click',e=>{ const r=mcv.getBoundingClientRect(); const py=(e.clientY-r.top)/r.height*540/MK+MY;
  const go=()=>{ sTarget=THREE.MathUtils.clamp(py-LOOK,S_MIN,S_MAX); yawT=0; pitchT=0; hideHint(); };
  mode==='tour'?go():backToTourThen(go); });

/* ============ loop ============ */
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.fov=camera.aspect<1?62:48; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
const v3=new THREE.Vector3(); let last=performance.now(); let T0=performance.now()+300;
function frame(now){
  requestAnimationFrame(frame); const dt=Math.min(.05,(now-last)/1000); last=now;
  sTarget=THREE.MathUtils.clamp(sTarget,S_MIN,S_MAX);
  if(mode==='tour'){
    const k=1-Math.pow(.0015,dt); sCur+=(sTarget-sCur)*k; const it=Math.min(1,(now-T0)/2400); lift=1-ease(it);
    if(!drag&&Math.abs(sTarget-sCur)>2){ yawT*=Math.pow(.25,dt); pitchT*=Math.pow(.25,dt); }
    yaw+=(yawT-yaw)*(1-Math.pow(.002,dt)); pitch+=(pitchT-pitch)*(1-Math.pow(.002,dt));
    tourPose(sCur); camera.position.copy(_p); camera.lookAt(_t); camera.userData.look=_t.clone();
  } else if(mode==='tween'){
    const k=Math.min(1,(now-tween.s)/tween.d), e=ease(k);
    camera.position.lerpVectors(tween.p0,tween.p1,e); const lk=new THREE.Vector3().lerpVectors(tween.t0,tween.t1,e); camera.lookAt(lk); camera.userData.look=lk;
    if(k>=1){ const d=tween.done; tween=null; d&&d(); }
  } else { controls.update(); camera.userData.look=controls.target.clone(); }
  // shadows follow the view
  const lk=camera.userData.look||_t; sun.target.position.set(lk.x,0,lk.z); sun.position.copy(sun.target.position).add(SUN_OFF); sun.target.updateMatrixWorld();
  // keep focused building clear of the panel
  viewOffset+=(viewOffsetTarget-viewOffset)*.1;
  if(Math.abs(viewOffset)>.002){ const w=innerWidth,h=innerHeight; camera.setViewOffset(w,h,isMobile?0:viewOffset*190,isMobile?viewOffset*(panel.offsetHeight||0)*.45:0,w,h);} else camera.clearViewOffset();
  renderer.render(scene,camera);
  // zone + progress UI
  const z=zoneAt(lookPy()); setZoneUI(z); $('zprog').style.width=((sCur-S_MIN)/(S_MAX-S_MIN)*100).toFixed(1)+'%';
  // tags
  const w=innerWidth,h=innerHeight;
  for(const b of DATA){ const t=tagEls.get(b.id); v3.copy(b.top).project(camera);
    const dist=camera.position.distanceTo(b.top); const isSel=selected&&selected.id===b.id;
    const isHov=hovered&&hovered.id===b.id;
    if(!(isSel||isHov)||v3.z>1){t.classList.add('hide');continue;}
    t.classList.remove('hide'); t.classList.add('near'); t.classList.remove('far');
    t.style.transform=`translate(${(v3.x*.5+.5)*w}px,${(-v3.y*.5+.5)*h}px) translate(-50%,calc(-100% - 6px))`; }
  for(const s of staticLabels){ v3.copy(s.p).project(camera); const d=camera.position.distanceTo(s.p); const vis=v3.z<1&&d<110;
    s.el.style.display=vis?'block':'none'; s.el.style.left=(v3.x*.5+.5)*w+'px'; s.el.style.top=(-v3.y*.5+.5)*h+'px'; }
  if(!isMobile) drawMini();
}
paint(); requestAnimationFrame(frame);
setTimeout(()=>{ $('loader').classList.add('done'); const m=location.hash.match(/^#b(\d+)$/); if(m) setTimeout(()=>select(+m[1],true),900); },300);
</script>
